services:
  postgres:
    image: postgres:17-alpine
    container_name: vennzya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vennzya
      POSTGRES_PASSWORD: vennzya_dev
      POSTGRES_DB: vennzya
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vennzya -d vennzya']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vennzya-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every outbound email in local dev — open http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: vennzya-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  redis-data:
